<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OMB Service</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F8F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OMB">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:light;--paper:#F7F8F5;--ink:#183B56;--volt:#D9FF64;--line:#DCE6EC;--mute:#6B8091;--white:#FFFFFF;--mist:#DCEAF2;--sage:#B8D5C0;--red:#EF4444;--bg:var(--paper);--card:var(--white);--acc:var(--ink);--accink:var(--ink);--blue:var(--ink);--ok:#2E7D4F;--bad:#EF4444;--warn:#B7791F;--grad:var(--ink)}
*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:20px 16px calc(104px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.8px;line-height:1.1}
h2{font-size:18px;font-weight:800;letter-spacing:-.3px;margin:28px 0 10px}
b{font-weight:700}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink)}
input::placeholder{color:var(--mute)}
button{font:inherit;font-weight:700;border:1px solid var(--ink);border-radius:12px;padding:13px 18px;min-height:48px;background:var(--ink);color:var(--white);cursor:pointer}
button.acc{background:var(--volt);color:var(--ink);border-color:var(--ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.bad{background:var(--white);color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--volt)}
.big{width:100%;font-size:17px;padding:16px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{flex:1;background:var(--white);color:var(--ink);border:1px solid var(--line);padding:10px 4px;font-size:14px}
.chips button.sel{background:var(--volt);border-color:var(--ink)}
.num{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--white);border:1px solid var(--line);white-space:nowrap}
.tag.run{background:var(--ink);color:var(--volt);border-color:var(--ink)}.tag.paid{background:var(--volt);color:var(--ink);border-color:var(--ink)}.tag.unpaid{background:var(--white);color:var(--warn);border-color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i,.stripe i{display:block;height:100%;background:var(--ink)}
.stripe{height:8px;border-radius:9px;overflow:hidden;background:var(--line);margin:12px 0}
#qr{display:flex;justify-content:center;background:var(--white);padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:488px;margin:0 auto;background:var(--ink);color:var(--white);padding:14px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:14px;border-left:6px solid var(--volt)}
.s{border-top:1px solid var(--line);padding:14px 0}.s:first-child{border-top:0}
.mute{color:var(--mute);font-size:14px;font-weight:500}
.admin-menu{position:sticky;top:0;z-index:8;background:var(--paper);padding:8px 0 12px;margin:0 0 4px}
.admin-menu-inner{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.admin-menu button{position:relative;padding:12px 8px;font-size:14px;line-height:1.15;min-height:52px;background:var(--white);color:var(--ink);border:1px solid var(--line)}
.admin-menu button.active{background:var(--ink);color:var(--volt);border-color:var(--ink)}
.admin-section-title{margin-top:14px}
.brand{display:flex;align-items:center;gap:8px;margin:6px 0 18px;font-size:24px;font-weight:800;letter-spacing:-.8px}
.brand svg{width:26px;height:26px;fill:var(--ink);background:var(--volt);border-radius:8px;padding:4px}.brand b{font-weight:800}
.hello{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:4px 0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--bad)}.dot.use{background:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);margin-top:2px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:16px;font-size:17px;border:1px solid var(--ink);color:var(--ink);margin-top:4px}
.btn.acc{background:var(--volt)}.btn.ghost{background:transparent;border-color:var(--line)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;background:var(--white);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{position:relative;flex:1;max-width:120px;background:none;color:var(--mute);border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:6px 4px;min-height:52px;border-radius:12px}
.nav button.on{color:var(--ink);background:var(--volt)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pwbox{position:relative}.pwbox input{padding-right:52px}
.eye{position:absolute;right:2px;top:2px;background:none;color:var(--mute);border:0;padding:0;width:44px;height:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-4px;background:var(--bad);color:var(--white);border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.nav .badge{top:2px;right:calc(50% - 26px)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;padding:4px;background:var(--white);border:1px solid var(--line);border-radius:14px}
.seg button{background:transparent;color:var(--mute);border:0;min-height:42px;padding:8px 4px;font-size:14px}
.seg button.sel{background:var(--ink);color:var(--volt)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.warnbox{border:1px solid var(--ink);background:var(--volt)}
.warnbox .s{border-color:rgba(23,23,23,.15)}.warnbox .mute{color:var(--ink);opacity:.7}
.warnbox button.acc{background:var(--ink);color:var(--volt)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.top{display:flex;align-items:center;gap:10px;margin:0 0 18px}.top b{flex:1;text-align:center;font-size:17px;font-weight:800}.top i{width:44px}
.top button{background:var(--white);color:var(--ink);border:1px solid var(--line);width:44px;height:44px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}
.hero{background:var(--ink);color:var(--white);border-radius:0 0 20px 20px;margin:-20px -16px 20px;padding:48px 20px 32px;text-align:center}
.hero img{width:80px;height:80px;border-radius:20px;background:var(--white);padding:6px}.hero h1{margin:12px 0 6px}.hero p{margin:0}
.coinbox{background:var(--ink);color:var(--white);border-radius:16px;padding:22px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0}
.coinbox .n{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;color:var(--volt);margin:4px 0}.coinbox small{opacity:.7;font-weight:500}
.coinbox button{background:var(--volt)!important;color:var(--ink)!important;border-color:var(--volt)}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.menu .t{flex:1}.menu small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.mi{width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}.mi.b{background:var(--volt);border-color:var(--ink)}
.av{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--volt);display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--volt);color:var(--ink);border:1px solid var(--ink);font-size:13px;font-weight:700}
.ring{position:relative;width:230px;height:230px;margin:12px auto}.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ring .c .ico{width:30px;height:30px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.tri b{display:block;font-size:17px}
.scan{aspect-ratio:1;border-radius:16px;background:var(--ink);position:relative;display:flex;align-items:center;justify-content:center;color:var(--white);margin:6px 0 14px;overflow:hidden}
.scan i{position:absolute;inset:14%;border:3px solid var(--volt);border-radius:16px}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.qerr{position:absolute;left:0;right:0;bottom:12px;padding:0 20px;text-align:center;font-size:14px;color:var(--white);z-index:2}
.mapbar{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;color:var(--mute)}
.map{height:300px;border-radius:16px;background:#DCEAF2;overflow:hidden;border:1px solid var(--line)}
.sheet{background:var(--white);border-radius:16px;padding:16px;margin:-40px 12px 0;position:relative;border:1px solid var(--ink)}
.ch{display:flex;align-items:center;gap:12px;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:14px;margin:8px 0;width:100%;color:var(--ink);text-align:left}
.ch.sel{border-color:var(--ink);background:var(--volt)}.ch .st{margin-left:auto;font-size:13px;font-weight:700}
.mask{position:fixed;inset:0;background:rgba(24,59,86,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--white);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;border:1px solid var(--ink)}
.pin{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--volt);display:flex;align-items:center;justify-content:center;border:3px solid var(--white);font-size:16px}.map .leaflet-container{height:100%;font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:700px){main{padding-top:32px}.nav{left:50%;right:auto;width:520px;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}}

/* Urban Eco Blue overrides */
body{color:var(--ink)}
button{border-color:var(--ink);border-radius:12px}
button.acc,.btn.acc{background:var(--volt);color:var(--ink);border-color:var(--volt)}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
button.bad{background:var(--red);color:var(--white);border-color:var(--red)}
input:focus,select:focus{border-color:var(--ink);outline:0;box-shadow:0 0 0 3px var(--mist)}
.chips button.sel{background:var(--ink);color:var(--white);border-color:var(--ink)}
.tag{background:var(--mist);border-color:transparent;color:var(--ink)}
.tag.paid{background:var(--sage);color:#1F5A38;border-color:transparent}
.tag.run{background:var(--ink);color:var(--volt)}
.tag.unpaid{background:#FDECEC;color:var(--red);border-color:transparent}
.nav{border-top:1px solid var(--line)}
.nav button.on{background:var(--mist);color:var(--ink)}
.seg button.sel,.admin-menu button.active{background:var(--ink);color:var(--white);border-color:var(--ink)}
.coinbox .n{color:var(--white)}
.coinbox small:first-child{color:var(--volt);opacity:1}
.coinbox button{background:var(--volt)!important;color:var(--ink)!important;border-color:var(--volt)}
.hero{background:var(--mist);color:var(--ink)}.hero p{color:var(--mute)}
.pill{background:var(--volt);border:0}
.brand svg{background:var(--mist)}
.mi{background:var(--mist);border-color:transparent}.mi.b{background:var(--sage);border-color:transparent}
.av{background:var(--mist);color:var(--ink)}
.ch.sel{background:var(--mist);border-color:var(--ink)}
.sheet,.dlg{border-color:var(--line)}
.warnbox{background:var(--mist);border:1px solid var(--line)}
.warnbox .mute{color:var(--mute);opacity:1}
.warnbox button.acc{background:var(--ink);color:var(--white);border-color:var(--ink)}
.bar i,.stripe i{background:var(--ink)}.bar,.stripe{background:var(--mist)}
.scan i{border-color:var(--volt)}
.pos{color:var(--ok)}.neg{color:var(--red)}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="js/app.js"></script>
</body>
</html>
